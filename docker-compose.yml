name: rag-chatbot

services:

  redis:
    image: chatbot-redis
    container_name: rag-chatbot-redis
    ports:
      - "6379:6379"
    restart: unless-stopped

  qdrant:
    image: chatbot-qdrant
    container_name: rag-chatbot-qdrant
    ports:
      - "6333:6333"
      - "6334:6334"
    restart: unless-stopped